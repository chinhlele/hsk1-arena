<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu Trường HSK1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<style>
/* Hệ thiết kế: nền xám nhạt, thẻ trắng bo tròn, nút "nổi" có viền đáy đậm, bảng màu kẹo ngọt; font Nunito */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#353B45; --muted:#656D78; --line:#E6E9ED; --line2:#CCD1D9;
  --blue:#3A73C9; --blue-d:#2A5598; --blue-t:#E8F0FC;
  --mint:#48CFAD; --mint-d:#2E9E82; --mint-t:#E3F7F1;
  --grass:#8CC152; --grass-t:#EEF7E3; --ok-ink:#3B6E17;
  --grape:#ED5565; --grape-d:#DA4453; --grape-t:#FDECEE; --no-ink:#B8323F;
  --sun:#FFCE54; --sun-d:#E8A317; --sun-t:#FFF6DC;
  --grid:#F2A9A0; --grid2:#F8D3CE;
  --tn1:#D8334A; --tn2:#2B8230; --tn3:#2F6FD6; --tn4:#8A4FD8; --tn5:#7A838F;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-han:'Noto Serif SC','Noto Serif CJK SC','Source Han Serif SC','Songti SC','STSong','SimSun',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-weight:600;font-size:15.5px;line-height:1.5;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:900;line-height:1.2}
h1{font-size:26px}
h2{font-size:21px}
h3{font-size:16.5px;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0}
.han{font-family:var(--f-han);font-weight:700}
.wrap{max-width:860px;margin:0 auto}

/* ---------- chữ Hán + pinyin ---------- */
ruby{ruby-position:over;ruby-align:center}
rt{font-family:var(--f-ui);font-weight:800;font-size:.44em;line-height:1.15;color:var(--muted);letter-spacing:0}
body:not(.py-on) rt{display:none}
.forcepy rt{display:revert!important}
.nopy rt,.nopy .pyl{display:none!important}
body.tc-on .tn1{color:var(--tn1)} body.tc-on .tn2{color:var(--tn2)} body.tc-on .tn3{color:var(--tn3)} body.tc-on .tn4{color:var(--tn4)} body.tc-on .tn5{color:var(--tn5)}
body.tc-on .nopy [class^="tn"]{color:inherit}
.pyt .tn1{color:var(--tn1)} .pyt .tn2{color:var(--tn2)} .pyt .tn3{color:var(--tn3)} .pyt .tn4{color:var(--tn4)} .pyt .tn5{color:var(--tn5)}
body:not(.tc-on) .pyt [class^="tn"]{color:inherit}
.pyt{font-weight:800}

/* ô chữ điền (田字格) */
.tz{display:inline-flex;gap:8px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.pyl{display:none;font-weight:800;font-size:max(12px,calc(var(--s,56px)*.26));line-height:1;color:var(--muted)}
body.py-on .pyl{display:block}
.box{position:relative;display:grid;place-items:center;width:var(--s,56px);height:var(--s,56px);border:2px solid var(--grid);border-radius:6px;background:var(--surface);
  font-family:var(--f-han);font-weight:700;font-size:calc(var(--s,56px)*.64);line-height:1;color:var(--ink)}
.box::before,.box::after{content:"";position:absolute;pointer-events:none}
.box::before{left:50%;top:0;bottom:0;border-left:1.5px dashed var(--grid2)}
.box::after{top:50%;left:0;right:0;border-top:1.5px dashed var(--grid2)}
.box>b{position:relative;z-index:1;font-weight:inherit}
body.tc-on .cell.tn1 .box,body.tc-on .cell.tn1 .pyl{color:var(--tn1)}
body.tc-on .cell.tn2 .box,body.tc-on .cell.tn2 .pyl{color:var(--tn2)}
body.tc-on .cell.tn3 .box,body.tc-on .cell.tn3 .pyl{color:var(--tn3)}
body.tc-on .cell.tn4 .box,body.tc-on .cell.tn4 .pyl{color:var(--tn4)}
body.tc-on .cell.tn5 .box,body.tc-on .cell.tn5 .pyl{color:var(--tn5)}
body.tc-on .nopy .cell .box{color:var(--ink)}

/* ---------- nút nổi ---------- */
.btn{--b:var(--blue);--bs:var(--blue-d);--bt:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;
  padding:11px 18px;font-weight:800;font-size:15.5px;background:var(--b);color:var(--bt);box-shadow:0 4px 0 var(--bs);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--bs)}
.btn.mint{--b:var(--mint);--bs:var(--mint-d);--bt:#123A30}
.btn.sun{--b:var(--sun);--bs:var(--sun-d);--bt:#3A2C05}
.btn.ghost{--b:var(--surface);--bs:var(--line2);--bt:var(--ink);box-shadow:0 4px 0 var(--bs),inset 0 0 0 2px var(--line)}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 var(--bs),inset 0 0 0 2px var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--bs)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--bs),inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:800;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- đầu trang ---------- */
.top{display:flex;align-items:center;gap:12px;padding:16px 0 10px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:13px;background:var(--grape-d);box-shadow:0 4px 0 #A92F3C;color:#fff;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:24px;flex:none}
.brand{font-weight:900;font-size:18px;line-height:1.2}
.brand small{display:block;font-weight:700;font-size:12.5px;color:var(--muted)}
.lvl{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{font-size:12.5px;font-weight:900;padding:4px 11px;border-radius:999px;background:var(--sun-t);color:#7A5300;white-space:nowrap}
.xpbar{width:110px;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sun-d);border-radius:9px;transition:width .4s}
.xptxt{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px}
.tgl{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-size:13.5px;font-weight:800;color:var(--muted)}
.tgl .sw{width:30px;height:18px;border-radius:9px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl[aria-pressed="true"]{color:var(--ink);border-color:#C9D9F2}
.tgl[aria-pressed="true"] .sw{background:var(--blue)}
.tgl[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.tones{display:none;gap:6px;font-size:12.5px;font-weight:800;margin-left:auto}
body.tc-on .tones{display:inline-flex}
.tones span{padding:2px 8px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-radius:11px;padding:9px 14px;font-weight:800;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}

/* ---------- thẻ chung ---------- */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{font-size:19px}
.sec small{color:var(--muted);font-size:13.5px}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:var(--blue-t);color:#24477D;font-size:14px;margin-top:14px}
.note svg{flex:none;width:18px;height:18px;margin-top:2px}

/* trang lộ trình */
.hero{display:flex;gap:18px;align-items:center;padding:20px;--c:#5D9CEC;--cd:#3A73C9}
.hero .eyebrow{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero h1{margin:4px 0 2px}
.hero .meta{color:var(--muted);font-size:14px}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero .big{flex:none;width:104px;height:104px;border-radius:26px;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:60px;
  background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--cd);margin-left:auto}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--cd,var(--blue));transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{padding:12px 14px;text-align:left}
.stat b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.stat b small{font-size:13px;color:var(--muted);font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
button.stat{cursor:pointer}
.stat.alert{background:var(--grape-t);border-color:#F6B9C0;box-shadow:0 4px 0 #F6B9C0}
.stat.alert b{color:var(--no-ink)}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{display:flex;gap:12px;align-items:center;padding:12px}
.pbadge{position:relative;flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:28px;
  background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--cd)}
.pbadge i{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--cd);color:#fff;font:900 12px/22px var(--f-ui);font-style:normal;text-align:center}
.pbadge .ck{position:absolute;bottom:-5px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--grass);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.pbadge .ck svg{width:12px;height:12px}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-weight:900;font-size:15px;line-height:1.25}
.pinfo small{color:var(--muted);font-size:12.5px}
.pinfo .bar{height:7px;margin-top:6px}
.pact{display:flex;flex-direction:column;gap:7px;flex:none}

.a-hero{display:flex;gap:20px;align-items:center;padding:20px}
.ring{--p:0;flex:none;width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--cd) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{display:block;font-family:var(--f-han);font-weight:900;font-size:36px;color:var(--cd)}
.ring small{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}
.a-body{flex:1;min-width:0}
.eyebrow{font-size:12.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cd small span{display:block}
.a-body h1{font-size:25px;margin-top:4px}
.a-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.a-chips>*{background:var(--bg);border:0;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:800;color:var(--ink)}
.a-chips button:hover{background:var(--line)}
.a-chips .alert{background:var(--grape-t);color:var(--no-ink)}
.a-chips .alert:hover{background:#F9D5DA}
.a-hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.cd{align-self:flex-start;text-align:center;background:var(--sun-t);border-radius:16px;padding:10px 14px;color:#7A5300;flex:none}
.cd b{display:block;font-size:28px;line-height:1;font-weight:900}
.cd small{font-size:12px;font-weight:800;line-height:1.3;display:block;margin-top:4px}
/* trang luyện tập */
.scope{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:2px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 4px 0 var(--line);transition:transform .1s}
.mode:hover:not([disabled]){transform:translateY(-2px)}
.mode:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:25px;background:color-mix(in srgb,var(--c) 22%,#fff);color:var(--cd)}
.mode b{display:block;font-size:15.5px;font-weight:900}
.mode small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.mode.big{grid-column:span 3;background:var(--blue);border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff}
.mode.big small{color:#fff;opacity:.9}
.mode.big .ic{background:rgba(255,255,255,.2);color:#fff}
.mode[disabled]{opacity:.5;cursor:not-allowed}

/* ---------- màn chơi ---------- */
.playhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.quit{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.quit svg{width:18px;height:18px}
.prog{flex:1;height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--grass);transition:width .3s}
.combo{flex:none;font-size:14px;font-weight:900;color:var(--muted);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.combo.hot{color:#C77700}
.card{padding:22px 18px;text-align:center}
.qlabel{font-size:13px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.prompt{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100px;justify-content:center}
.prompt .tz{--s:76px}
.vi-big{font-size:24px;font-weight:900}
.sent{font-family:var(--f-han);font-weight:700;font-size:27px;line-height:1.9}
.blank{display:inline-block;min-width:2em;border-bottom:4px solid var(--blue);color:var(--blue);font-family:var(--f-ui);line-height:1.1}
.speak{display:inline-flex;align-items:center;gap:6px;background:var(--blue-t);color:var(--blue-d);border:0;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:800}
.speak svg{width:17px;height:17px}
.bigspk{width:96px;height:96px;border-radius:28px;border:0;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);display:grid;place-items:center}
.bigspk svg{width:44px;height:44px}
.bigspk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.opt{position:relative;padding:14px 12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);color:var(--ink);font-size:16.5px;font-weight:800;min-height:62px;transition:border-color .1s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--line2)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{position:absolute;top:6px;left:9px;font-size:11.5px;color:var(--line2);font-weight:900}
.opt.hanopt{font-family:var(--f-han);font-size:25px;font-weight:700;line-height:1.5}
.opt.ok{border-color:var(--grass);background:var(--grass-t);box-shadow:0 4px 0 var(--grass)}
.opt.no{border-color:var(--grape);background:var(--grape-t);box-shadow:0 4px 0 var(--grape-d)}
.opt[disabled]{cursor:default}
.ropt .han{font-size:24px;display:block;line-height:1.2}
.ropt small{font-weight:700;color:var(--muted);font-family:var(--f-ui);font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.03)}}
.answer{min-height:70px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;border:2px dashed var(--line2);border-radius:16px;margin-top:18px}
.answer:empty::before{content:"Chạm vào các từ bên dưới để xếp câu";color:var(--muted);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.tok{font-family:var(--f-han);font-size:22px;font-weight:700;padding:6px 13px;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);color:var(--ink);line-height:1.6}
.tok.used{visibility:hidden}
.answer .tok{border-color:#B9CCEB;box-shadow:0 3px 0 #B9CCEB}
.answer.ok .tok{border-color:var(--grass);background:var(--grass-t);box-shadow:0 3px 0 var(--grass)}
.answer.no{border-color:var(--grape)}
.check{margin-top:18px;display:flex;gap:10px;justify-content:center}
.fb{margin-top:18px;padding:14px 16px;border-radius:16px;text-align:left;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fb.ok{background:var(--grass-t)}.fb.no{background:var(--grape-t)}
.fb .msg{flex:1;min-width:210px}
.fb .msg>b{display:block;font-size:17px;font-weight:900;margin-bottom:2px}
.fbn{color:var(--ink);font-size:15.5px;font-weight:800}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px;text-align:center;max-width:400px}
.cmp .side{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.cmp .side.on{border-color:var(--grass)}
.cmp .g{font-size:34px;line-height:1.35}
.cmp .side.off .g{color:var(--muted)}
.cmp .forcepy rt{font-size:.4em}
.cmp small{display:block;font-size:13.5px;font-weight:800;line-height:1.3}
.cmp .side.off small{color:var(--muted)}
.gv{font-size:.7em;margin-left:4px;color:var(--grape-d)}
.vs{font-size:12px;color:var(--muted);font-weight:900}
.cnote{font-size:13.5px;margin-top:8px}
.fb .detail .cnote .han{font-size:16px}
.one{display:flex;gap:12px;align-items:center;margin-top:8px}
.tile{min-width:58px;padding:2px 10px;border:2px solid var(--grid);border-radius:8px;background:var(--surface);font-size:32px;line-height:1.6;text-align:center;flex:none}
.pyx2{font-weight:800;color:var(--muted)}
.fb.ok .msg>b{color:var(--ok-ink)}.fb.no .msg>b{color:var(--no-ink)}
.fb .detail{font-size:15px}
.fb .detail small{display:block;font-size:15px;line-height:1.55;margin-top:6px}
.fb .detail .one small{display:inline;margin:0}
.missed li small{font-size:14px}
.fb .detail .han{font-size:20px}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px}
.audio-note{font-size:13px;color:var(--muted);max-width:340px}

/* thẻ ghi nhớ */
.flip{perspective:1100px;margin:0 auto;max-width:440px}
.flip-in{position:relative;height:350px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;overflow:auto}

function segPy(text){
  const ch=[...text],out=[];let i=0;
  while(i<ch.length){
    const c=ch[i];
    if(!isHan(c)){out.push({c});i++;continue}
    let hit=false;
    for(let L=Math.min(5,ch.length-i);L>=2;L--){const s=WORDPY[ch.slice(i,i+L).join('')];if(s){for(let k=0;k<L;k++)out.push({c:ch[i+k],s:s[k]});i+=L;hit=true;break}}
    if(!hit){out.push({c,s:CHARPY[c]||'',solo:true});i++}
  }
  out.forEach((o,j)=>{if(!o.solo)return;const nx=out[j+1],pv=out[j-1];
    if(o.c==='不'&&nx&&nx.s&&toneOf(nx.s)===4)o.s='bú';
    if(o.c==='一'){const num=(pv&&'第十零二三四五六七八九期'.includes(pv.c))||!nx||!nx.s||'月日号点十零一二三四五六七八九'.includes(nx.c);
      if(!num)o.s=(toneOf(nx.s)===4||nx.c==='个')?'yí':'yì'}});
  return out;
}
/* chữ Hán có pinyin (ruby) + màu thanh */
function hz(text,ruby=true){
  return segPy(text).map(o=>{if(!isHan(o.c))return esc(o.c);const t=toneOf(o.s);
    return ruby&&o.s?`<ruby class="tn${t}">${o.c}<rt>${esc(o.s)}</rt></ruby>`:`<span class="tn${t}">${o.c}</span>`}).join('');
}
/* ô chữ điền có nhãn pinyin phía trên */
function tzw(text,s){
  return`<span class="tz"${s?` style="--s:${s}px"`:''}>${segPy(text).map(o=>`<span class="cell tn${toneOf(o.s)}"><span class="pyl">${esc(o.s||'')}</span><span class="box"><b>${esc(o.c)}</b></span></span>`).join('')}</span>`;
}

function distractors(w,key,n=3){
  const k=v=>key==='p'?fold(v.p).replace(/ /g,''):v[key];
  const bad=v=>v.h===w.h||v.m===w.m||isSyn(w.h,v.h)||k(v)===k(w);
  const len=[...w.h].length;
  const grp=shuffle(GROUPS[w.g].words.filter(v=>!bad(v)&&(key==='m'||[...v.h].length===len)));
  const same=shuffle(VOCAB.filter(v=>!bad(v)&&[...v.h].length===len));
  const any=shuffle(VOCAB.filter(v=>!bad(v)));
  const out=[],seen=new Set([k(w)]);
  for(const v of [...grp.slice(0,2),...same,...any]){const kv=k(v);if(seen.has(kv)||out.some(o=>isSyn(o.h,v.h)||o.m===v.m))continue;seen.add(kv);out.push(v);if(out.length>=n)break}
  return out;
}

const TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',ü:'ǖǘǚǜ'};
const TONED={};for(const b in TONES)[...TONES[b]].forEach((c,i)=>TONED[c]=[b,i]);
function toneVariants(p){
  const chars=[...p],pos=chars.map((c,i)=>TONED[c]?i:-1).filter(i=>i>=0),out=new Set();
  for(let k=0;k<40&&out.size<6;k++){
    const c=chars.slice();const i=pick(pos);if(i===undefined)break;const[b,t]=TONED[c[i]];
    let nt=rnd(4);if(nt===t)nt=(t+1+rnd(3))%4;c[i]=TONES[b][nt];
    if(pos.length>1&&Math.random()<.4){const j=pick(pos);const[b2]=TONED[c[j]];c[j]=TONES[b2][rnd(4)]}
    const s=c.join('');if(s!==p)out.add(s);
  }return[...out];
}
function qPinyin(w){

function qReview(){
  const k=pick(P.wrong);
  if(k.startsWith('F:')){const f=FILL.find(x=>'F:'+x[0]===k);if(f)return qFill(f)}
  if(k.startsWith('S:')){const s=SENTS.find(x=>'S:'+x[0]===k);if(s)return qOrder(s)}
  if(k.startsWith('RC:')||k.startsWith('R:')){const q=qRadChar(k.slice(k.indexOf(':')+1));return q||qRadical()}
  if(k.startsWith('RN:')&&RADX[k.slice(3)])return qRadName(RADX[k.slice(3)]);
  if(k.startsWith('RM:')&&RADX[k.slice(3)])return qRadMeaning(RADX[k.slice(3)]);
  if(k.startsWith('N:'))return qNumber();
  const w=VBY[k];return w?pick([qMeaning,qReverse,qListen,qPinyin])(w):qMeaning();
}

 ['犬','大','犬 = 大 thêm một chấm bên phải'],['衣','礻','衤 có 2 chấm bên phải · 礻 (bộ Thị) chỉ có 1 chấm'],['攴','欠','攵 có nét phẩy nhỏ trên cùng · 欠 có 2 nét phẩy hình miệng há']];
const CONF={};CONF_PAIRS.forEach(([a,b,n])=>{CONF[a]=CONF[a]||[b,n];CONF[b]=CONF[b]||[a,n]});
const shortM=m=>String(m).split(/[,;]/)[0];
function cmpSide(glyph,cap,on){return`<div class="side ${on?'on':'off'}"><div class="g han">${glyph}</div><small>${cap}</small></div>`}
function radFb(x){
  const c=CONF[x.r],y=c&&RADX[c[0]];
  const gl=r=>esc(r.r)+(r.v?`<span class="gv">${esc(r.v)}</span>`:'');
  if(y)return`<div class="cmp">${cmpSide(gl(x),esc(x.hv)+' · '+esc(shortM(x.m)),1)}<span class="vs">khác</span>${cmpSide(gl(y),esc(y.hv)+' · '+esc(shortM(y.m)),0)}</div><div class="cnote">${esc(c[1])}</div>`;
  return`<div class="one"><span class="tile han">${gl(x)}</span><div><span class="pyx2">${esc(x.p)}</span>${x.v?`<br><small>${esc(x.r)} có dạng biến thể ${esc(x.v)}</small>`:''}</div></div>${x.note?`<div class="cnote">${esc(x.note)}</div>`:''}`;
}
function vFb(w){
  const syn=SYNM[w.h]&&[...SYNM[w.h]].map(h=>VBY[h]).filter(Boolean),y=syn&&syn[0];
  const side=(v,on)=>cmpSide(`<span class="forcepy">${hz(v.h)}</span>`,esc(v.m),on);
  if(y)return`<div class="cmp">${side(w,1)}<span class="vs">khác</span>${side(y,0)}</div><div class="cnote">Hán Việt: ${esc(w.hv)} · ${esc(w.pos)}</div>`;
  return`<div class="one"><span class="tile han forcepy">${hz(w.h)}</span><div><small>Hán Việt: ${esc(w.hv)}<br>${esc(w.pos)}</small></div></div>`;
}
function decorate(q){
  if(q.fbName!==undefined)return q;
  if(['meaning','reverse','listen'].includes(q.kind)&&VBY[q.key]){const w=VBY[q.key];q.brief=q.explain;q.fbName=`${pyHTML(w.raw)} · ${esc(w.m)}`;q.explain=vFb(w)}
  else if(q.kind==='radical'&&RADX[q.rad]){const x=RADX[q.rad];q.brief=q.explain;
    q.fbName=q.key.startsWith('RC:')?`<span class="han">${esc(q.key.slice(3))}</span> thuộc bộ ${esc(x.hv)} · ${esc(x.m)}`:`Bộ ${esc(x.hv)} · ${esc(x.m)}`;
    q.explain=radFb(x)+(q.key.startsWith('RN:')&&x.ex.length?`<div class="cnote" style="color:var(--muted)">Ví dụ: ${x.ex.map(e=>`<span class="han">${esc(e.h)}</span> ${esc(e.m)}`).join(' · ')}</div>`:'')}

function start(mode,opt={}){
  if(mode==='flash')return startFlash(opt.vgroup);
  if(mode==='review'&&!P.wrong.length)return;
  let total=mode==='test'?20:10,rq=null;
  if(mode==='radical'&&!opt.quick){rq=shuffle(opt.rgroup!=null?RGROUPS[opt.rgroup][1].map(radByNo):RAD60);total=rq.length}
  G={mode,total,i:0,res:[],combo:0,xp:0,missed:[],gram:opt.gram||null,rgroup:opt.rgroup!=null?opt.rgroup:null,vgroup:opt.vgroup!=null?opt.vgroup:null,used:new Set(),rq,quick:!!opt.quick};
  next();
}
function next(){
  if(G.i>=G.total)return finish();
  let q,tries=0;
  do{q=GEN[G.mode]();tries++}while(G.used.has(q.label+q.key)&&tries<14&&!q.key.startsWith('N:'));
  G.used.add(q.label+q.key);G.q=decorate(q);G.answered=false;G.placed=[];
  V.tab='play';render();
  if(q.kind==='listen'||q.kind==='meaning')speak(q.speakT);
}
function answer(val){
  if(G.answered)return;G.answered=true;
  const q=G.q,ok=q.type==='order'?q.alts.includes(val):val===q.ans;
  G.res.push(ok);
  const k=q.key;
  if(VBY[k]){const w=P.words[k]||(P.words[k]={c:0,w:0});ok?w.c++:w.w++}
  if(q.rad){const r=P.rads[q.rad]||(P.rads[q.rad]={c:0,w:0});ok?r.c++:r.w++}
  if(ok){G.combo++;const gain=10+Math.min(G.combo-1,5)*2;G.xp+=gain;P.xp+=gain;
    const idx=P.wrong.indexOf(k);if(idx>=0&&(G.mode==='review'||(VBY[k]&&score(k)>=1)||(q.rad&&rscore(q.rad)>=1)))P.wrong.splice(idx,1);
  }else{G.combo=0;G.missed.push(q);if(!P.wrong.includes(k))P.wrong.push(k)}
  if(P.wrong.length>150)P.wrong=P.wrong.slice(-150);
  save();sfx(ok);G.last={ok,val};
  renderPlay();
  if(q.type==='order'||!ok||q.han)speak(q.speakT);
}
function finish(){
  const d=today();
  if(P.streak.last!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);P.streak.n=P.streak.last===y?P.streak.n+1:1;P.streak.last=d}
  P.rounds++;save();V.tab='result';render();
}
function startFlash(vg){
  const base=vg!=null?GROUPS[vg].words:(G=null,pool());
  const fresh=shuffle(base.filter(v=>status(v.h)!=='done'));
  const deck=(fresh.length?fresh:shuffle(base)).slice(0,vg!=null?base.length:15);
  G={mode:'flash',deck,i:0,known:0,again:0,flipped:false,vgroup:vg!=null?vg:null,res:[],missed:[],xp:0};V.tab='play';render();
}
function flashMark(known){
  const w=G.deck[G.i],s=P.words[w.h]||(P.words[w.h]={c:0,w:0});
  if(known){s.c=Math.max(s.c,s.w+3);G.known++;P.xp+=4;const i=P.wrong.indexOf(w.h);if(i>=0)P.wrong.splice(i,1)}
  else{s.w=Math.max(s.w,s.c);G.again++;G.deck.push(w)}
  save();G.i++;G.flipped=false;
  if(G.i>=G.deck.length||G.i>=80){G.res=Array(G.known).fill(true);G.total=G.known+G.again;G.xp=G.known*4;finish();return}
  renderPlay();
}

function renderWords(){
  const q=fold(V.q.trim());
  const hit=v=>!q||v.h.includes(V.q.trim())||fold(v.p).replace(/ /g,'').includes(q.replace(/ /g,''))||fold(v.m).includes(q)||fold(v.hv).includes(q);
  const pass=v=>V.filter==='all'||(V.filter==='new'&&v.isNew)||(V.filter==='learn'&&status(v.h)!=='done')||(V.filter==='done'&&status(v.h)==='done');
  const card=v=>`<button class="word" data-say="${esc(v.h)}"><span class="dot ${status(v.h)}"></span><span class="han">${hz(v.h)}</span><span class="hv">${esc(v.hv)}</span><span class="m">${esc(v.m)}</span>${v.isNew?'<span class="nw">mới</span>':''}</button>`;
  const html=GROUPS.map(g=>{const items=g.words.filter(v=>pass(v)&&hit(v));if(!items.length)return'';const[c,cd]=gcol(g.i);
    return`<div class="ghead" style="--c:${c};--cd:${cd}"><span class="pbadge">${esc(g.g)}</span><h3>${g.i+1}. ${esc(g.n)}</h3><small>${g.words.length} từ · ${gDone(g)} đã thuộc</small><span class="gacts"><button class="btn ghost sm" data-flash="${g.i}">Thẻ</button><button class="btn sm" data-gq="${g.i}">Luyện</button></span></div>
    <div class="wgrid">${items.map(card).join('')}</div>`}).join('');
  $('#main').innerHTML=`<h1>300 từ vựng HSK 1</h1><p class="sub">Theo đề cương HSK 3.0, chia ${GROUPS.length} chặng theo chủ đề. Chạm vào từ để nghe. Nhãn “mới” là ${NEWN} từ không có trong HSK 1 cũ.</p>
  <div class="wtools"><input id="wq" placeholder="Tìm chữ Hán, pinyin, nghĩa hoặc Hán Việt…" value="${esc(V.q)}">
  ${[['all','Tất cả'],['new','Từ mới'],['learn','Chưa thuộc'],['done','Đã thuộc']].map(([id,l])=>`<button class="chip" data-filter="${id}" aria-pressed="${V.filter===id}">${l}</button>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--line2)"></i>Chưa học</span><span><i style="background:var(--sun-d)"></i>Đang học</span><span><i style="background:var(--grass)"></i>Đã thuộc</span></div>
  <div id="wlist">${html||'<p class="sub" style="margin-top:20px">Không có từ nào khớp.</p>'}</div>
  <div class="removed panel"><b>4 từ HSK 1 cũ đã rời cấp 1</b><ul>${REMOVED.map(([h,p,m,why])=>`<li><span class="han">${hz(h)}</span> — ${esc(m)} (${esc(why)})</li>`).join('')}</ul></div>`;
}
function renderPlay(){
  if(G.mode==='flash')return renderFlash();
  const q=G.q,done=G.res.length;
  let body='';
  if(q.type==='mcq'){
    body=`<div class="opts">${q.opts.map((o,i)=>{let cls='';if(G.answered){if(o.v===q.ans)cls='ok';else if(o.v===G.last.val)cls='no shake'}
      return`<button class="opt ${q.han?'hanopt':''} ${cls}" data-ans="${esc(o.v)}" ${G.answered?'disabled':''}><span class="k">${i+1}</span>${o.l}</button>`}).join('')}</div>`;
  }else{
    const placed=G.placed.map((bi,pi)=>`<button class="tok" data-unplace="${pi}" ${G.answered?'disabled':''}>${hz(q.bank[bi].t)}</button>`).join('');
    body=`<div class="answer ${G.answered?(G.last.ok?'ok':'no shake'):''}">${placed}</div>
    <div class="bank">${q.bank.map((b,bi)=>`<button class="tok ${G.placed.includes(bi)?'used':''}" data-place="${bi}" ${G.answered?'disabled':''}>${hz(b.t)}</button>`).join('')}</div>
    ${G.answered?'':`<div class="check"><button class="btn" id="checkOrder" ${G.placed.length===q.bank.length?'':'disabled'}>Kiểm tra</button><button class="btn ghost" id="clearOrder">Làm lại</button></div>`}`;
  }
  const fb=G.answered?`<div class="fb ${G.last.ok?'ok pop':'no'}"><div class="msg"><b>${G.last.ok?pick(['Chính xác!','Giỏi lắm!','Đúng rồi!','Tuyệt!']):'Chưa đúng'}${q.fbName?` <span class="fbn">${G.last.ok?'':'Đáp án: '}${q.fbName}</span>`:''}</b><div class="detail">${q.fbName?'':(G.last.ok?'':'Đáp án: ')}${q.explain}</div>
    ${q.speakT?`<button class="speak" data-say="${esc(q.speakT)}" style="margin-top:8px">${SPK}Nghe lại</button>`:''}</div>
    <button class="btn ${G.last.ok?'mint':''}" id="nextQ">${G.i+1>=G.total?'Xem kết quả':'Tiếp tục'}</button></div>`:'';
  $('#main').innerHTML=`<div class="playhead"><button class="quit" id="quit" aria-label="Thoát">${XIC}</button><div class="prog"><i style="width:${done/G.total*100}%"></i></div><div class="combo ${G.combo>=2?'hot':''}">${G.combo>=2?`Combo ×${G.combo}`:`${G.i+1}/${G.total}`}</div></div>
  <div class="card panel"><div class="qlabel">${esc(q.label)}</div><div class="prompt ${q.nopy?'nopy':''}">${q.prompt}</div>${body}${fb}
  ${G.answered?'':`<div class="hint">${q.type==='mcq'?'Phím tắt: 1–4 để chọn':'Chạm từ đã xếp để trả lại'}</div>`}</div>`;
  if(G.answered){const b=$('#nextQ');if(b&&b.focus)b.focus()}
}
function renderFlash(){
  const w=G.deck[G.i],left=Math.max(G.deck.length-G.i,1);
  $('#main').innerHTML=`<div class="playhead"><button class="quit" id="quit" aria-label="Thoát">${XIC}</button><div class="prog"><i style="width:${G.i/(G.i+left)*100}%"></i></div><div class="combo">${G.known} thuộc</div></div>
  ${G.vgroup!=null?`<p class="sub" style="text-align:center;margin:-4px 0 12px">Chặng ${G.vgroup+1} · ${esc(GROUPS[G.vgroup].n)}</p>`:''}
  <div class="flip ${G.flipped?'on':''}" id="flip"><div class="flip-in">
    <div class="face panel">${tzw(w.h)}<button class="speak" data-say="${esc(w.h)}">${SPK}Nghe</button><span class="sub">Nhớ nghĩa rồi chạm để lật</span></div>
    <div class="face back panel"><div class="bigw forcepy">${hz(w.h)}</div><div class="mean">${esc(w.m)}</div>
      <div class="tags"><span class="tag">Hán Việt: ${esc(w.hv)}</span><span class="tag">${esc(w.pos)}</span>${w.isNew?'<span class="tag new">mới HSK 3.0</span>':''}</div>
      <div class="rrows">${radRows(w.h)}</div></div>
  </div></div>
  <div class="fcbtns">${G.flipped?`<button class="btn ghost" id="fcAgain">Chưa nhớ</button><button class="btn mint" id="fcKnow">Đã thuộc</button>`:`<button class="btn" id="fcFlip">Lật thẻ</button>`}</div>
  <p class="hint" style="text-align:center">Thẻ “chưa nhớ” sẽ quay lại cuối bộ. Phím: Space lật · 1 chưa nhớ · 2 đã thuộc.</p>`;
}
function renderResult(){
  const ok=G.res.filter(Boolean).length,tot=G.total,pct=tot?ok/tot:0,fl=G.mode==='flash';
  const [st,lab]=fl?['记','Đã ôn xong bộ thẻ']:pct>=.9?['优','Xuất sắc!']:pct>=.7?['良','Khá lắm!']:pct>=.5?['中','Đạt rồi']:['加油','Cố lên nhé'];
  const g=G.vgroup!=null?GROUPS[G.vgroup]:null,nx=g&&GROUPS[g.i+1];
  let cta=`<button class="btn" id="again">Chơi lại</button>`;
  if(fl&&g)cta=`<button class="btn mint" data-gq="${g.i}">Luyện 10 câu chặng này</button><button class="btn ghost" id="again">Học lại thẻ</button>`;
  else if(G.mode==='group'&&g&&pct>=.8&&nx)cta=`<button class="btn mint" data-flash="${nx.i}">Sang chặng ${nx.i+1}: ${esc(nx.n)}</button><button class="btn ghost" id="again">Luyện lại</button>`;
  $('#main').innerHTML=`<div class="result panel"><div class="medal ${st.length>1?'small':''} ${!fl&&pct<.5?'lo':''}">${st}</div>
  <h1>${lab}</h1><p class="sub">${esc(MODE_NAME(G.mode))}${g?' · Chặng '+(g.i+1)+': '+esc(g.n):''}${G.gram?' · '+esc(GRAMMAR.find(x=>x.id===G.gram).t):''}${G.rgroup!=null?' · Nhóm '+(G.rgroup+1)+': '+esc(RGROUPS[G.rgroup][0]):''}</p>
  <div class="rstats"><div><b>${ok}/${tot}</b><span>${fl?'Thẻ đã thuộc':'Câu đúng'}</span></div><div><b>+${G.xp}</b><span>XP nhận được</span></div><div><b>${g?gDone(g)+'/'+g.words.length:mastered()+'/300'}</b><span>Từ đã thuộc</span></div></div>
  ${G.missed.length?`<div class="missed"><h3>Câu cần xem lại</h3><ul>${G.missed.map(q=>`<li>${q.brief||q.explain}</li>`).join('')}</ul></div>`:''}
  <div class="rbtns">${cta}${P.wrong.length?`<button class="btn ghost" data-mode="review">Ôn ${P.wrong.length} câu sai</button>`:''}<button class="btn ghost" id="home">Về lộ trình</button></div></div>`;
}

/* ================= SỰ KIỆN ================= */
function togglePref(k){P[k]=!P[k];save();applyPrefs();document.querySelectorAll(`[data-tgl="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',String(!!P[k])));if(k==='sound'&&!P.sound){try{speechSynthesis.cancel()}catch(e){}}}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-say]');if(!t)return;
  if(t.dataset.tgl){togglePref(t.dataset.tgl);return}
  if(t.dataset.say!==undefined&&t.dataset.ans===undefined){speak(t.dataset.say);if(t.matches('.word,.speak,.mini,.rexb,.bigspk'))return}
  if(t.dataset.tab){V.tab=t.dataset.tab;render();window.scrollTo&&window.scrollTo(0,0);return}
  if(t.dataset.mode){if(!t.disabled)start(t.dataset.mode);return}
  if(t.dataset.flash!==undefined){startFlash(+t.dataset.flash);return}
  if(t.dataset.gq!==undefined){start('group',{vgroup:+t.dataset.gq});return}
  if(t.dataset.gram){start('fill',{gram:t.dataset.gram});return}
  if(t.dataset.rquick){start('radical',{quick:true});return}
  if(t.dataset.rgroup!==undefined){start('radical',{rgroup:+t.dataset.rgroup});return}
  if(t.dataset.scope){P.scope=t.dataset.scope;save();renderPractice();return}
  if(t.dataset.ans!==undefined){answer(t.dataset.ans);return}
  if(t.dataset.place!==undefined){const bi=+t.dataset.place;if(!G.placed.includes(bi)){G.placed.push(bi);speak(G.q.bank[bi].t);renderPlay()}return}
  if(t.dataset.unplace!==undefined){G.placed.splice(+t.dataset.unplace,1);renderPlay();return}
  if(t.dataset.filter){V.filter=t.dataset.filter;renderWords();return}
  switch(t.id){
    case'checkOrder':answer(G.placed.map(bi=>G.q.bank[bi].t).join(''));break;
    case'clearOrder':G.placed=[];renderPlay();break;
    case'nextQ':G.i++;next();break;
    case'quit':G=null;V.tab='home';render();break;
    case'again':G.mode==='flash'?startFlash(G.vgroup):start(G.mode,{gram:G.gram,rgroup:G.rgroup,vgroup:G.vgroup,quick:G.quick});break;
    case'home':V.tab='home';render();break;
    case'fcFlip':flipCard();break;
    case'fcKnow':flashMark(true);break;
    case'fcAgain':flashMark(false);break;
    case'reset':$('#resetbox').innerHTML='<span class="confirm">Xóa toàn bộ XP và tiến độ? <button class="chip" id="resetYes" style="color:var(--no-ink)">Xóa</button> <button class="chip" id="resetNo">Hủy</button></span>';break;
    case'resetYes':P=blank();save();render();break;
    case'resetNo':renderPractice();break;
  }
});
document.addEventListener('click',e=>{const f=e.target.closest('#flip');if(f&&!e.target.closest('button'))flipCard()});
document.addEventListener('input',e=>{if(e.target.id==='wq'){V.q=e.target.value;const pos=e.target.selectionStart;renderWords();const i=$('#wq');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if((e.key==='p'||e.key==='P')&&!e.metaKey&&!e.ctrlKey){togglePref('py');return}
  if(V.tab!=='play'||!G)return;
  if(G.mode==='flash'){if(e.key===' '){e.preventDefault();flipCard()}else if(G.flipped&&(e.key==='ArrowRight'||e.key==='2'))flashMark(true);else if(G.flipped&&(e.key==='ArrowLeft'||e.key==='1'))flashMark(false);return}
  if(G.answered&&e.key==='Enter'){e.preventDefault();G.i++;next();return}
  if(!G.answered&&G.q.type==='mcq'&&/^[1-4]$/.test(e.key)){const o=G.q.opts[+e.key-1];if(o)answer(o.v)}
  if(!G.answered&&G.q.type==='order'&&e.key==='Enter'&&G.placed.length===G.q.bank.length)answer(G.placed.map(bi=>G.q.bank[bi].t).join(''));
});
render();
</script>
